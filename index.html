<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone - Modern E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">Shop<span>Zone</span></a>
            
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button id="searchBtn">🔍</button>
            </div>

            <div class="cart-icon-container">
                <button id="cartBtn" class="cart-btn">
                    🛒 Cart (<span id="cartCount">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Upgrade Your Lifestyle Today</h1>
            <p>Discover top-rated products at unbeatable prices.</p>
            <a href="#products-section" class="shop-now-btn">Shop Now</a>
        </div>
    </section>

    <!-- Products Section -->
    <main class="main-container" id="products-section">
        <h2 class="section-title">Featured Products</h2>
        <div id="productGrid" class="product-grid">
            <!-- Products will be loaded dynamically via Fetch API -->
        </div>
    </main>

    <!-- Shopping Cart Modal Overlay -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Shopping Cart</h2>
                <span id="closeModal" class="close-btn">&times;</span>
            </div>
            <div id="cartItemsContainer" class="cart-items">
                <!-- Cart items will be rendered here -->
            </div>
            <div class="modal-footer">
                <h3>Total: $<span id="cartTotal">0.00</span></h3>
                <button id="checkoutBtn" class="checkout-btn">Checkout</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 ShopZone. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
